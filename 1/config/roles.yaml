# Число игроков по умолчанию (флаг -n его переопределяет). От 5 до 20
default_players: 7

# Мафии: max(1, N / mafia_divisor). Не меньше 3
mafia_divisor: 3

# Особые роли: 0 или 1, в порядке приоритета
# Если игроков не хватает, роли отбрасываются с конца списка
specials:
  commissar: 1  # Комиссар — обязательная, мирные
  doctor: 1     # Доктор — обязательная, мирные
  maniac: 1     # Маньяк — обязательная, одиночка
  ninja: 1      # Ниндзя — необязательная, мафия
  hacker: 1     # Хакер — необязательная, мирные
  elder: 1      # Старейшина — необязательная, мирные