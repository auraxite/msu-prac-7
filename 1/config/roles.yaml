# Раздача ролей. Мирные жители — все оставшиеся игроки.
# Отступы — только пробелы.

# Мафии: max(1, N / mafia_divisor). Не меньше 3.
mafia_divisor: 3

# 0 или 1. Ниндзя — один из мафии; появляется, только если мафии ≥ 2.
ninja: 1

# Особые роли: 0 или 1, в порядке приоритета.
# Если игроков не хватает, роли отбрасываются с конца списка.
# commissar, doctor, maniac обязательны: 0 — ошибка, если не указаны — считаются 1.
specials:
  commissar: 1
  doctor: 1
  maniac: 1
  hacker: 1
  elder: 1
